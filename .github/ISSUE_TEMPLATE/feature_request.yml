name: Feature request / 功能建议
description: Suggest a focused improvement. / 提出范围清晰的改进建议。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        HistoryClipboard is local-only today. Cross-device synchronization is
        planned but not implemented; proposals must preserve explicit pairing,
        authenticated end-to-end encryption, and a disabled-by-default design.

        HistoryClipboard 当前仅在本机工作。跨设备同步仍未实现；相关建议必须保留
        显式配对、身份验证的端到端加密以及默认禁用原则。
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / 提交前检查
      options:
        - label: I searched existing issues and the roadmap. / 我已搜索已有 Issue 和路线图。
          required: true
        - label: The request does not require publishing private clipboard content. / 此建议不要求公开私人剪贴板内容。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe the user need, not only a preferred implementation. / 请描述用户需求，而不只是实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 替代方案
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact / 隐私与安全影响
      description: Explain new data, permissions, network access, or Windows integration. / 说明新增数据、权限、网络访问或 Windows 集成。
    validations:
      required: true
