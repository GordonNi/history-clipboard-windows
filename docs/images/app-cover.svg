<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">HistoryClipboard for Windows</title>
  <desc id="desc">Abstract overlapping clipboard cards in a calm light-blue Windows-inspired composition.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#d7efff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#c9eaff" stop-opacity=".88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3479a8" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#background)"/>
  <circle cx="1030" cy="86" r="150" fill="#91d2ff" opacity=".22"/>
  <circle cx="108" cy="470" r="190" fill="#70bdf2" opacity=".16"/>
  <g transform="translate(96 70)" filter="url(#shadow)">
    <rect x="60" y="34" width="330" height="344" rx="34" fill="#a9dcfb" opacity=".72" transform="rotate(-7 225 206)"/>
    <rect x="90" y="18" width="330" height="344" rx="34" fill="url(#glass)" stroke="#8bc9ef" stroke-width="3" transform="rotate(4 255 190)"/>
    <rect x="42" y="64" width="330" height="344" rx="34" fill="#f8fdff" stroke="#67b7e9" stroke-width="4"/>
    <rect x="92" y="112" width="132" height="28" rx="14" fill="#5eaee0"/>
    <rect x="92" y="172" width="226" height="18" rx="9" fill="#b6dff7"/>
    <rect x="92" y="212" width="194" height="18" rx="9" fill="#c6e7fa"/>
    <rect x="92" y="252" width="214" height="18" rx="9" fill="#b6dff7"/>
    <rect x="92" y="322" width="94" height="42" rx="21" fill="#dff3ff" stroke="#7bc0ea" stroke-width="2"/>
    <circle cx="314" cy="343" r="21" fill="#62afe0"/>
  </g>
  <g transform="translate(568 126)">
    <text x="0" y="66" fill="#153c56" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">HistoryClipboard</text>
    <text x="2" y="120" fill="#35627e" font-family="Segoe UI, Arial, sans-serif" font-size="28">Clipboard history that stays on your PC.</text>
    <g transform="translate(2 170)">
      <rect width="192" height="54" rx="27" fill="#ffffff" stroke="#8bc9ef" stroke-width="2"/>
      <text x="96" y="35" text-anchor="middle" fill="#28658a" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">LOCAL ONLY</text>
      <rect x="214" width="214" height="54" rx="27" fill="#4b9fd2"/>
      <text x="321" y="35" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">WINDOWS 10/11</text>
    </g>
    <text x="2" y="302" fill="#557a90" font-family="Segoe UI, Arial, sans-serif" font-size="21">Text · Images · Search · Pin · Retention · Tray</text>
  </g>
</svg>
